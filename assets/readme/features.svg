<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title description">
  <title id="title">What ENVY Veil does</title>
  <desc id="description">Encrypt first: AES-256-GCM with scrypt seals the file before it is hidden. (aes-256-gcm); Image carriers: Hide bytes in the low bits of a lossless PNG or BMP. (png / bmp); Audio carriers: Tuck a payload into the samples of a 16-bit WAV. (wav); Capacity meter: See exactly how much a carrier can hold before you hide. (capacity); Inspect &amp; reveal: Check for a payload, then decrypt it with your passphrase. (inspect / reveal); Honest by design: Concealment is not the security — the encryption is. (no overclaiming)</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop stop-color="#a71c7d" stop-opacity=".22"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="398" rx="20"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.fc0 .sh{animation:sh 9s ease-in-out 0.0s infinite}.fc1 .sh{animation:sh 9s ease-in-out -1.5s infinite}.fc2 .sh{animation:sh 9s ease-in-out -3.0s infinite}.fc3 .sh{animation:sh 9s ease-in-out -4.5s infinite}.fc4 .sh{animation:sh 9s ease-in-out -6.0s infinite}.fc5 .sh{animation:sh 9s ease-in-out -7.5s infinite}@keyframes sh{0%,100%{opacity:0}45%,55%{opacity:.9}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="400" fill="#050713"/>
    <ellipse cx="920" cy="200" rx="300" ry="220" fill="url(#cloud)"/>
    <ellipse cx="90" cy="390" rx="340" ry="220" fill="url(#rose)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="620" cy="26" r="1"/><circle cx="780" cy="376" r="1"/><circle cx="970" cy="43" r="1.2"/><circle cx="450" cy="382" r=".8"/></g>
    <g class="fc fc0">
      <rect x="30" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ff3db4" stroke-opacity=".35"/>
      <circle cx="72" cy="72" r="22" fill="#ff3db4" fill-opacity=".12"/>
      <g transform="translate(60.0 60) scale(1.000)" fill="none" stroke="#ff3db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
      <text x="108" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Encrypt first</text>
      <text x="54" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">AES-256-GCM with scrypt seals</text>
      <text x="54" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">the file before it is hidden.</text>
      <text x="54" y="172" font-size="13" fill="#ff3db4" font-family="Menlo, Consolas, 'Courier New', monospace">aes-256-gcm</text>
      <rect class="sh" x="30" y="30" width="300" height="3" rx="1.5" fill="#ff3db4" opacity=".0"/>
    </g>
    <g class="fc fc1">
      <rect x="350" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#35e8ff" stroke-opacity=".35"/>
      <circle cx="392" cy="72" r="22" fill="#35e8ff" fill-opacity=".12"/>
      <g transform="translate(380.0 60) scale(1.000)" fill="none" stroke="#35e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></g>
      <text x="428" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Image carriers</text>
      <text x="374" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Hide bytes in the low bits of</text>
      <text x="374" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">a lossless PNG or BMP.</text>
      <text x="374" y="172" font-size="13" fill="#35e8ff" font-family="Menlo, Consolas, 'Courier New', monospace">png / bmp</text>
      <rect class="sh" x="350" y="30" width="300" height="3" rx="1.5" fill="#35e8ff" opacity=".0"/>
    </g>
    <g class="fc fc2">
      <rect x="670" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ac8cff" stroke-opacity=".35"/>
      <circle cx="712" cy="72" r="22" fill="#ac8cff" fill-opacity=".12"/>
      <g transform="translate(700.0 60) scale(1.000)" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
      <text x="748" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Audio carriers</text>
      <text x="694" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Tuck a payload into the samples</text>
      <text x="694" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">of a 16-bit WAV.</text>
      <text x="694" y="172" font-size="13" fill="#ac8cff" font-family="Menlo, Consolas, 'Courier New', monospace">wav</text>
      <rect class="sh" x="670" y="30" width="300" height="3" rx="1.5" fill="#ac8cff" opacity=".0"/>
    </g>
    <g class="fc fc3">
      <rect x="30" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ff3db4" stroke-opacity=".35"/>
      <circle cx="72" cy="262" r="22" fill="#ff3db4" fill-opacity=".12"/>
      <g transform="translate(60.0 250) scale(1.000)" fill="none" stroke="#ff3db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></g>
      <text x="108" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Capacity meter</text>
      <text x="54" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">See exactly how much a carrier</text>
      <text x="54" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">can hold before you hide.</text>
      <text x="54" y="362" font-size="13" fill="#ff3db4" font-family="Menlo, Consolas, 'Courier New', monospace">capacity</text>
      <rect class="sh" x="30" y="220" width="300" height="3" rx="1.5" fill="#ff3db4" opacity=".0"/>
    </g>
    <g class="fc fc4">
      <rect x="350" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#35e8ff" stroke-opacity=".35"/>
      <circle cx="392" cy="262" r="22" fill="#35e8ff" fill-opacity=".12"/>
      <g transform="translate(380.0 250) scale(1.000)" fill="none" stroke="#35e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></g>
      <text x="428" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Inspect &amp; reveal</text>
      <text x="374" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Check for a payload, then</text>
      <text x="374" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">decrypt it with your passphrase.</text>
      <text x="374" y="362" font-size="13" fill="#35e8ff" font-family="Menlo, Consolas, 'Courier New', monospace">inspect / reveal</text>
      <rect class="sh" x="350" y="220" width="300" height="3" rx="1.5" fill="#35e8ff" opacity=".0"/>
    </g>
    <g class="fc fc5">
      <rect x="670" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ac8cff" stroke-opacity=".35"/>
      <circle cx="712" cy="262" r="22" fill="#ac8cff" fill-opacity=".12"/>
      <g transform="translate(700.0 250) scale(1.000)" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
      <text x="748" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Honest by design</text>
      <text x="694" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Concealment is not the security</text>
      <text x="694" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">— the encryption is.</text>
      <text x="694" y="362" font-size="13" fill="#ac8cff" font-family="Menlo, Consolas, 'Courier New', monospace">no overclaiming</text>
      <rect class="sh" x="670" y="220" width="300" height="3" rx="1.5" fill="#ac8cff" opacity=".0"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="398.5" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
