name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the app and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller build
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build the standalone bundle, wheel, sdist, and checksums
        run: python scripts/build_release_bundle.py
      - name: Smoke test the standalone bundle
        run: python scripts/smoke_test_release.py
      - name: Upload bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: envy-veil-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/envy-veil-v*.tar.gz
            dist/envy-veil-v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
